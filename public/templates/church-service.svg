<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="150" fill="#4c1d95"/>
  
  <!-- Welcome slide -->
  <rect x="10" y="10" width="180" height="35" fill="#ffffff" opacity="0.1" rx="4"/>
  <rect x="20" y="20" width="100" height="5" fill="#ffffff" opacity="0.9" rx="2"/>
  <rect x="20" y="30" width="80" height="3" fill="#ffffff" opacity="0.7" rx="1"/>
  
  <!-- Prayer section -->
  <rect x="10" y="55" width="85" height="40" fill="#ffffff" rx="4"/>
  <rect x="20" y="65" width="65" height="3" fill="#4c1d95" opacity="0.8" rx="1"/>
  <rect x="20" y="75" width="55" height="2" fill="#4c1d95" opacity="0.6" rx="1"/>
  <rect x="20" y="82" width="50" height="2" fill="#4c1d95" opacity="0.6" rx="1"/>
  <rect x="20" y="89" width="45" height="2" fill="#4c1d95" opacity="0.6" rx="1"/>
  
  <!-- Worship songs -->
  <rect x="105" y="55" width="85" height="40" fill="#f3f4f6" rx="4"/>
  <rect x="115" y="65" width="65" height="3" fill="#4c1d95" opacity="0.8" rx="1"/>
  <!-- Musical notes representation -->
  <circle cx="125" cy="78" r="3" fill="#4c1d95" opacity="0.4"/>
  <circle cx="135" cy="75" r="3" fill="#4c1d95" opacity="0.4"/>
  <circle cx="145" cy="80" r="3" fill="#4c1d95" opacity="0.4"/>
  <circle cx="155" cy="77" r="3" fill="#4c1d95" opacity="0.4"/>
  <rect x="115" y="87" width="50" height="2" fill="#4c1d95" opacity="0.6" rx="1"/>
  
  <!-- Scripture reading -->
  <rect x="10" y="105" width="85" height="35" fill="#ffffff" rx="4"/>
  <rect x="20" y="115" width="65" height="3" fill="#4c1d95" opacity="0.8" rx="1"/>
  <rect x="20" y="125" width="50" height="3" fill="#4c1d95" opacity="0.6" rx="1"/>
  
  <!-- Closing -->
  <rect x="105" y="105" width="85" height="35" fill="#4c1d95" rx="4"/>
  <rect x="115" y="115" width="65" height="3" fill="#ffffff" opacity="0.8" rx="1"/>
  <rect x="115" y="125" width="50" height="3" fill="#ffffff" opacity="0.6" rx="1"/>
  
  <!-- Cross symbol -->
  <rect x="168" y="18" width="2" height="14" fill="#ffffff" opacity="0.6"/>
  <rect x="163" y="23" width="12" height="2" fill="#ffffff" opacity="0.6"/>
  
  <!-- Bible representation -->
  <rect x="160" y="75" width="15" height="10" fill="#4c1d95" opacity="0.4" rx="1"/>
  <rect x="162" y="77" width="11" height="1" fill="#ffffff" opacity="0.6"/>
  <rect x="162" y="79" width="9" height="1" fill="#ffffff" opacity="0.6"/>
  <rect x="162" y="81" width="10" height="1" fill="#ffffff" opacity="0.6"/>
  <rect x="162" y="83" width="8" height="1" fill="#ffffff" opacity="0.6"/>
</svg>