<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="150" fill="#1e3a8a"/>
  
  <!-- Header slide representation -->
  <rect x="10" y="10" width="180" height="40" fill="#ffffff" opacity="0.1" rx="4"/>
  <rect x="20" y="20" width="80" height="4" fill="#ffffff" opacity="0.6" rx="2"/>
  <rect x="20" y="30" width="60" height="4" fill="#ffffff" opacity="0.4" rx="2"/>
  
  <!-- Content slides -->
  <rect x="10" y="60" width="85" height="35" fill="#ffffff" opacity="0.9" rx="4"/>
  <rect x="20" y="70" width="65" height="3" fill="#1e3a8a" opacity="0.8" rx="1"/>
  <rect x="20" y="78" width="50" height="3" fill="#1e3a8a" opacity="0.6" rx="1"/>
  <rect x="20" y="86" width="40" height="3" fill="#1e3a8a" opacity="0.4" rx="1"/>
  
  <rect x="105" y="60" width="85" height="35" fill="#f8fafc" rx="4"/>
  <rect x="115" y="70" width="65" height="3" fill="#1e3a8a" opacity="0.8" rx="1"/>
  <rect x="115" y="78" width="50" height="3" fill="#1e3a8a" opacity="0.6" rx="1"/>
  <rect x="115" y="86" width="40" height="3" fill="#1e3a8a" opacity="0.4" rx="1"/>
  
  <!-- Footer slide -->
  <rect x="10" y="105" width="180" height="35" fill="#1e3a8a" rx="4"/>
  <rect x="20" y="115" width="80" height="4" fill="#ffffff" opacity="0.8" rx="2"/>
  <rect x="20" y="125" width="60" height="4" fill="#ffffff" opacity="0.6" rx="2"/>
  
  <!-- Business icons -->
  <circle cx="160" cy="25" r="8" fill="#ffffff" opacity="0.3"/>
  <rect x="156" y="21" width="8" height="8" fill="#1e3a8a" opacity="0.6" rx="1"/>
  
  <!-- Chart representation -->
  <rect x="150" y="110" width="3" height="15" fill="#ffffff" opacity="0.6"/>
  <rect x="155" y="115" width="3" height="10" fill="#ffffff" opacity="0.6"/>
  <rect x="160" y="112" width="3" height="13" fill="#ffffff" opacity="0.6"/>
  <rect x="165" y="108" width="3" height="17" fill="#ffffff" opacity="0.6"/>
</svg>